# Lint config for the backend module. Deliberately close to golangci-lint's
# defaults — the point is a floor that catches ignored errors and dead code,
# not a style tribunal.
run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

issues:
  # golangci-lint defaults to reporting only the first 3 instances of an issue
  # and 50 total, which quietly hides the tail of a real regression.
  max-issues-per-linter: 0
  max-same-issues: 0

  exclude-rules:
    # errcheck in tests only ever flags setup helpers whose failure would fail
    # the assertion on the next line anyway. Checking them adds noise without
    # adding a signal. Every other linter still applies to test files.
    - path: _test\.go
      linters:
        - errcheck
