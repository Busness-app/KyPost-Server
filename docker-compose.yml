# Pinned so the volume-name prefix ("<project>_<volume>") stays stable no
# matter what directory this repo is checked out into. Without this, Compose
# derives the project name from the deploy directory's basename, so checking
# the repo out into a differently-named folder silently detaches the
# container from its existing volumes and starts it against brand-new empty
# ones instead — losing config/state/private keys (PGP, IMAP, TOTP) with no
# error.
name: kypost-server

services:
  kypost-server:
    build: .
    container_name: KyPost-Server
    ports:
      - "5866:5866"
    #  - "11434:11434"  #Uncomment to expose Ollama API
    environment:
      WEB_PORT: 5866
      TZ: ${TZ:-America/New_York}
      SECRET_DIR: ${SECRET_DIR:-/kypost/private}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://127.0.0.1:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-nemotron-3-nano:4b}
      TUNING_FILE: ${TUNING_FILE:-/kypost/config/TUNING.md}
      SERVER_BASE_URL: ${SERVER_BASE_URL:-}
      PAIRING_SECRET: ${PAIRING_SECRET:-}
      CAPTCHA_PROVIDER: ${CAPTCHA_PROVIDER:-}
      CAPTCHA_SITE_KEY: ${CAPTCHA_SITE_KEY:-}
      CAPTCHA_SECRET_KEY: ${CAPTCHA_SECRET_KEY:-}
      PUSH_RELAY_URL: ${PUSH_RELAY_URL:-}
      PUSH_RELAY_KEY: ${PUSH_RELAY_KEY:-}
      PUSH_RELAY_KEY_FILE: ${PUSH_RELAY_KEY_FILE:-}
      APNS_RELAY_URL: ${APNS_RELAY_URL:-}
      APNS_RELAY_KEY: ${APNS_RELAY_KEY:-}
      APNS_RELAY_KEY_FILE: ${APNS_RELAY_KEY_FILE:-}
    # No `dns:` override. This container previously forced 8.8.8.8/8.8.4.4,
    # which sent every lookup this server makes — each user's IMAP and SMTP
    # host, every WKD key-discovery probe, every recipient domain — to
    # Google, reconstructing the correspondence graph of a product whose
    # whole premise is self-hosting. It also broke split-horizon and
    # internal DNS. Docker's default (the host's resolver) is correct; set
    # `dns:` here yourself only if your host resolver genuinely can't
    # resolve public names.
    volumes:
      - kypost_config:/kypost/config
      - kypost_private:/kypost/private
      - kypost_logs:/kypost/logs
      - kypost_state:/kypost/state
      - ${OLLAMA_MODELS_HOST_DIR:-./share/ollama/models}:/kypost/ollama-models
    restart: unless-stopped

volumes:
  kypost_config:
  kypost_private:
  kypost_logs:
  kypost_state:
