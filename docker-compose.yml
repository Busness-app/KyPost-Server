# Pinned so the volume-name prefix ("<project>_<volume>") does not depend on the
# checkout directory's name. Without it, Compose derives the project name from
# that basename, and a rename silently detaches the container from its volumes
# and starts against empty ones — losing config, state and private keys (PGP,
# IMAP, TOTP) with no error.
name: kypost-server

services:
  kypost-server:
    # Release installs pull this image; `build` stays so a checkout can still
    # be built locally for development or before the first published release.
    image: ${KYPOST_IMAGE:-ghcr.io/yoshiofthewire/kypost-server}:${KYPOST_VERSION:-stable}
    build: .
    container_name: KyPost-Server

    # Join `kypost-net` (defined at the bottom) at a fixed address.
    #
    # The proxy in front of this server must be on this network too, or every
    # caller arrives source-NATed as the same gateway address and every IP-keyed
    # lockout collapses into one shared bucket.
    # See docs/Reverse_Proxy_Networking.md.
    networks:
      kypost-net:
        # Pinned so the address a proxy is configured with survives a rebuild;
        # Docker otherwise allocates in start order and a recreate can move this
        # container out from under a tunnel or an nginx upstream.
        #
        # Prefer addressing this container by name where you can — this network
        # has DNS, so `http://KyPost-Server:5866` is rebuild-proof and stays
        # right even if the subnet changes. The pin is for proxies that will
        # only take an IP.
        ipv4_address: ${KYPOST_IP:-10.89.0.5}

    # KYPOST_BIND is REQUIRED. There is no default, and that is the point.
    #
    # This speaks plain HTTP unless TLS_CERT_FILE is set, so an unproxied 5866 on
    # a LAN is a mail client in cleartext — session cookie included — to every
    # other host on it. And with TRUSTED_PROXY_CIDRS set, anything that can reach
    # 5866 directly can forge X-Forwarded-For and defeat every IP-keyed lockout
    # in the server.
    #
    # This used to default to 0.0.0.0, justified by an earlier release that
    # defaulted to 127.0.0.1 and took working Cloudflare Tunnel setups offline.
    # Both of those are answers to "which wrong default breaks fewer people",
    # and only the operator knows how their proxy reaches this container — so
    # ask, once, at the only moment the answer is knowable. An operator who has
    # to set one variable is inconvenienced; an operator whose mail server is on
    # every interface in the clear does not find out.
    #
    #   KYPOST_BIND=127.0.0.1     # proxy on this host, reaching 127.0.0.1:5866
    #   KYPOST_BIND=192.168.1.5   # only the interface the proxy talks to
    #   KYPOST_BIND=0.0.0.0       # all interfaces — deliberate, not inherited
    #
    # Better still, publish nothing: comment this out entirely, put the proxy on
    # kypost-net and point it at http://KyPost-Server:5866.
    # See docs/Reverse_Proxy_Networking.md.
    ports:
      - "${KYPOST_BIND:?set KYPOST_BIND in .env — 127.0.0.1 for a proxy on this host, your LAN IP for a proxy elsewhere, or 0.0.0.0 to deliberately publish on every interface (cleartext unless TLS_CERT_FILE is set)}:5866:5866"
    #  - "127.0.0.1:11434:11434"  #Uncomment to expose Ollama API
    environment:
      WEB_PORT: 5866
      # Peers whose X-Forwarded-For/Proto/Host may be believed: a comma-separated
      # list of CIDRs or bare IPs (not hostnames). Empty trusts nothing and uses
      # the connection's own address.
      #
      # Set it to your proxy's address specifically, not a wide range — a
      # container on kypost-net is the address pinned for it there
      # (e.g. 10.89.0.10/32); a proxy on this host is 127.0.0.1/32.
      #
      # Do not leave it empty behind a proxy. Failing closed is right, but the
      # closed state keys every caller as the gateway — one shared lockout
      # bucket. Verify with GET /api/status: `clientIp` must be your own public
      # address and `proxyHeadersTrusted` must be true.
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      # Optional inbound TLS. Set both to serve HTTPS directly instead of plain
      # HTTP; leave both empty for the default. Setting only one is a startup
      # error rather than a silent fallback to cleartext.
      #
      # With these set, the session cookie's Secure flag, HSTS, and the login
      # proof-of-work's secure-context requirement are all satisfied by the
      # connection itself — TRUSTED_PROXY_CIDRS stops mattering, because no
      # forwarded header has to be believed.
      #
      # Mount the files read-only (see the commented volume below). Certificates
      # are never baked into the image: a self-signed one in a shipped image
      # trains users to click through browser warnings, and a real one leaks its
      # private key into a distributable layer.
      TLS_CERT_FILE: ${TLS_CERT_FILE:-}
      TLS_KEY_FILE: ${TLS_KEY_FILE:-}
      KYPOST_BIND: ${KYPOST_BIND:?set KYPOST_BIND in .env}
      ALLOW_INSECURE_HTTP: ${ALLOW_INSECURE_HTTP:-}
      TZ: ${TZ:-America/New_York}
      SECRET_DIR: ${SECRET_DIR:-/kypost/private}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://127.0.0.1:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-nemotron-3-nano:4b}
      TUNING_FILE: ${TUNING_FILE:-/kypost/config/TUNING.md}
      SERVER_BASE_URL: ${SERVER_BASE_URL:-}
      PAIRING_SECRET: ${PAIRING_SECRET:-}
      CAPTCHA_PROVIDER: ${CAPTCHA_PROVIDER:-}
      CAPTCHA_SITE_KEY: ${CAPTCHA_SITE_KEY:-}
      CAPTCHA_SECRET_KEY: ${CAPTCHA_SECRET_KEY:-}
      PUSH_RELAY_URL: ${PUSH_RELAY_URL:-}
      PUSH_RELAY_KEY: ${PUSH_RELAY_KEY:-}
      PUSH_RELAY_KEY_FILE: ${PUSH_RELAY_KEY_FILE:-}
      APNS_RELAY_URL: ${APNS_RELAY_URL:-}
      APNS_RELAY_KEY: ${APNS_RELAY_KEY:-}
      APNS_RELAY_KEY_FILE: ${APNS_RELAY_KEY_FILE:-}
    # Do not add a `dns:` override. Every lookup this server makes — each
    # user's IMAP and SMTP host, every WKD probe, every recipient domain —
    # would go to it, reconstructing the correspondence graph of a product
    # whose premise is self-hosting, and it breaks split-horizon/internal DNS.
    # Docker's default (the host resolver) is correct.
    volumes:
      # Uncomment to mount certificates for TLS_CERT_FILE/TLS_KEY_FILE above.
      # Read-only, and pointed at wherever your ACME client writes. Renewals are
      # picked up without a restart (the server re-reads the pair when it changes
      # on disk), which matters because a restart logs every user out — sessions
      # are in-memory by design.
      # - /etc/letsencrypt/live/mail.example.com:/kypost/tls:ro
      - kypost_config:/kypost/config
      - kypost_private:/kypost/private
      - kypost_logs:/kypost/logs
      - kypost_state:/kypost/state
      - ${OLLAMA_MODELS_HOST_DIR:-./share/ollama/models}:/kypost/ollama-models
    restart: unless-stopped

    # Docker's default is 10 seconds from SIGTERM to SIGKILL, and this container
    # has four supervised processes to unwind behind one signal: supervisord
    # stops the API (which drains in-flight HTTP for up to 20s — app.go's
    # shutdownTimeout) and the daemon (which cancels the poll tick and waits for
    # the IMAP, SMTP and state writes underneath it to return) before Ollama
    # unloads a model. Ten seconds cut across all of that, so an ordinary
    # `docker compose up -d` on a new image could SIGKILL a state write —
    # duplicate sends and half-written bookkeeping from a routine update.
    #
    # 90s is a ceiling, not a delay: a clean stop takes seconds, and this is
    # only what Docker is willing to wait before losing patience. It has to
    # exceed supervisord's own stopwaitsecs (supervisord.conf) plus the time
    # supervisord takes to walk its programs, or the outer deadline fires first
    # and the inner ones never get to matter.
    stop_grace_period: 90s

    # This container runs an LLM in-process with the mail server. Without a
    # cap, the kernel's OOM killer arbitrates between Ollama and the API under
    # memory pressure and picks whichever has the larger RSS — usually Ollama,
    # but not reliably, and losing the API silently is much worse. Bounding the
    # container makes the failure predictable and keeps a self-hoster's other
    # services alive. Override via .env on a machine with room to spare.
    mem_limit: ${KYPOST_MEM_LIMIT:-8g}
    cpus: ${KYPOST_CPUS:-4.0}

    # Kernel-level limits, because this process parses hostile input for a
    # living: MIME from strangers, vCards from a CardDAV peer, OpenPGP packets,
    # and an LLM's output. mem_limit and cpus bound what a bug can consume;
    # these bound what it can reach.
    #
    # no-new-privileges stops any setuid binary in the image from raising
    # privilege — entrypoint.sh drops root via setpriv before exec'ing
    # supervisord, and nothing afterwards has any business climbing back.
    security_opt:
      - no-new-privileges:true

    # Drop every capability, then add back only what the entrypoint needs
    # before it drops to the kypost user:
    #   CHOWN, FOWNER  — chown the mounted volumes on first start
    #   SETUID, SETGID — the setpriv drop itself
    #   DAC_OVERRIDE   — write into a volume whose host ownership does not
    #                    match, which is the normal case for a bind mount
    # Notably absent: NET_RAW, NET_ADMIN, SYS_ADMIN, SYS_PTRACE, MKNOD.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - SETUID
      - SETGID
      - DAC_OVERRIDE

    # A fork bomb in any of the four supervised processes otherwise takes the
    # host's PID table with it, not just this container. The steady state is
    # well under a hundred threads across supervisord, the API, the daemon and
    # Ollama; this is loose enough that a model load will not brush it.
    pids_limit: ${KYPOST_PIDS_LIMIT:-512}

    # Docker only knows the container is unhealthy if something asks. The image
    # defines the HEALTHCHECK; this is what makes an unhealthy container
    # visible in `docker compose ps` rather than a process that is technically
    # running while serving nothing.
    healthcheck:
      # start_period covers the first-boot model pull, which is far slower
      # than any subsequent start.
      start_period: 180s
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  kypost_config:
  kypost_private:
  kypost_logs:
  kypost_state:

# The network this server and the proxy in front of it share.
#
# Named and given an explicit subnet so a proxy in another Compose project can
# join it by a stable name, and because Docker only accepts the pinned
# ipv4_address above on a user-configured network.
#
# Putting a proxy on it, recovering from "incorrect label" or "Pool overlaps",
# and why the peer address is wrong without this:
#   docs/Reverse_Proxy_Networking.md
#
# Do not create this network with `docker network create` — Compose only manages
# networks carrying its own labels. See the doc above to recover if you have.
networks:
  kypost-net:
    name: ${KYPOST_NETWORK:-kypost-net}
    ipam:
      config:
        - subnet: ${KYPOST_SUBNET:-10.89.0.0/24}
