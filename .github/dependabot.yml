version: 2

# SHA-pinned actions do not update themselves, and a pin nobody advances is a
# frozen dependency rather than a safe one. This is the counterpart to the
# pinning in ci.yml and ollama-bump.yml: Dependabot proposes the new SHA, CI
# proves the workflow still works, a human merges it.
#
# Note that these PRs need the same repository setting the ollama-bump workflow
# needs — Settings > Actions > General > "Allow GitHub Actions to create and
# approve pull requests" — or they are silently never opened.
#
# Every ecosystem is grouped into a single PR. The first run of this file
# without grouping opened ten at once (the whole accumulated backlog of a repo
# that had never run Dependabot), each triggering a full matrix including a
# `docker build`. Grouping caps that at three PRs per interval no matter how
# far behind the tree has drifted.
#
# Majors are deliberately grouped in alongside minors rather than ignored.
# Every update in that first batch was a major — vite 5->8, react-router 6->7,
# @vitejs/plugin-react 4->6, jsdom 29->30, checkout 4->7 — so a config that
# skipped majors would have filtered out all of the actual work while still
# claiming coverage. They arrive together and get reviewed on purpose.
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: gomod
    directory: "/backend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      go-modules:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      # Split by what a break would mean. A runtime bump (dompurify, openpgp,
      # quill, react) can ship a vulnerability to a browser parsing hostile
      # mail; a build-tooling bump can only break the build, which CI catches
      # before anyone sees it. Separating them means the urgent one is never
      # stuck behind a vite major that needs a migration.
      frontend-runtime:
        dependency-type: production
        patterns:
          - "*"
      frontend-tooling:
        dependency-type: development
        patterns:
          - "*"
    # quill 2.0.3 is the whole affected range of GHSA-v3m3-f69x-jf25 (XSS via
    # the HTML export feature) and the advisory has no first_patched_version --
    # 2.0.3 is the newest release, so "upgrade to the fix" is not yet an option
    # and 2.0.2 is the safe version. Dependabot proposed the bump anyway (#77),
    # because it tracks releases, not advisories against them. The runtime
    # audit gate in ci.yml runs at --audit-level=low precisely so this cannot
    # be merged, but a PR that can only ever fail CI gets re-opened every week
    # and trains people to ignore a red frontend job.
    #
    # Pinned to the single bad version, not the minor: 2.0.4 is how this gets
    # fixed and must still be proposed the day it lands. Delete this entry
    # then -- and the paragraph in ci.yml that explains the audit level with
    # this advisory as its example.
    ignore:
      - dependency-name: "quill"
        versions: ["2.0.3"]
    commit-message:
      prefix: "chore(deps)"
