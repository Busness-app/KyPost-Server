name: ci

# AGENTS.md's governance section requires "CI must pass" for new logic. Until
# this file existed that rule was unsatisfiable — 28 Go packages with real
# tests and nothing running them on push.
# Push is restricted to main rather than "**": with a pull_request trigger as
# well, every push to a PR branch otherwise runs the whole suite twice for the
# same commit.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Supersede an in-flight run when the same ref is pushed again. Without this,
# three quick pushes to a PR branch keep three full matrices alive — including
# three `docker build`s, the most expensive job here — reporting on two commits
# nobody is waiting for. main is excluded from cancellation: a green tick
# against a specific main commit is the record of whether that commit built,
# and cancelling it destroys that record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Every action below is pinned to a commit SHA rather than a tag. A tag is a
# mutable pointer: whoever controls it controls a job running in this
# repository, and ollama-bump.yml's job holds `contents: write` and
# `pull-requests: write`. The Dockerfile already refuses to trust an unpinned
# Ollama tarball for exactly this reason; the CI that builds it gets the same
# standard. Dependabot keeps these current — see .github/dependabot.yml.

jobs:
  backend:
    name: ci-backend
    runs-on: ubuntu-latest
    # The api package alone takes 7-8 minutes under -race, and users another 4.
    # 25 leaves headroom without inheriting GitHub's 6-hour default, which is
    # what a genuinely hung test would otherwise burn before anyone noticed. It
    # is also the outer bound the -timeout below sits inside.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # Run via `go run`, not golangci-lint-action. The action installs a
      # prebuilt binary, and golangci-lint refuses to lint a module whose Go
      # version is newer than the one it was itself built with:
      #
      #   can't load config: the Go language version (go1.24) used to build
      #   golangci-lint is lower than the targeted Go version (1.26.4)
      #
      # This module targets 1.26.4, so the action failed instantly on a
      # toolchain mismatch that has nothing to do with the code. `go run`
      # compiles the linter with the same toolchain setup-go just installed
      # from go.mod, so the two can never disagree — and it keeps working
      # across future Go bumps without anyone remembering to touch this file.
      #
      # Pinned, not @latest: this is a program executing against the source
      # tree, held to the same standard as everything else here. Dependabot
      # does not track `go run` versions, so bumping it is manual — that is
      # the trade for a gate that cannot spuriously break.
      - name: golangci-lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run ./...

      # gofmt and go vet are a floor, not a security review. This server holds
      # users' PGP private keys and IMAP credentials; a known-vulnerable
      # dependency reaching main unremarked is not an acceptable failure mode.
      #
      # Pinned for the same reason golangci-lint above is, and the Dockerfile
      # refuses `curl | sh`: @latest is remote code fetched at build time from a
      # source this repo does not control, executed against the tree with the
      # workflow's token, undoing the SHA-pinning of every action here. The
      # vulnerability database is fetched fresh at run time regardless, so this
      # pin does not stale the results — it only fixes which code does the
      # checking.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      # -race matters more than usual here: this codebase runs the api and the
      # poller as goroutines in "all" mode and as two processes under
      # supervisord, and several stores are shared between them.
      #
      # -count=1 is not optional. Without it `go test` serves cached results
      # for unchanged packages, which is exactly how internal/app stayed
      # locally green for days while failing here on every push.
      #
      # -timeout is set because go test's default is 10 minutes PER TEST BINARY
      # and internal/api honestly needs more than that here: it is dominated by
      # scrypt, and -race on a shared runner has had it at 7-9 minutes with the
      # figure moving with whatever else the host is doing. Twice that put it
      # over, and the run died with `panic: test timed out after 10m0s` while
      # the named running test was one second old — nothing hung, the budget
      # was simply wrong.
      #
      # 20m, not "off" and not the job's 25: a hung test must still hit a Go
      # timeout, because that panic dumps every goroutine's stack and is the
      # only artifact that says WHERE it hung. Letting timeout-minutes kill the
      # job instead trades that for a truncated log.
      - name: go test -race
        run: go test -race -count=1 -timeout=20m ./...

  frontend:
    name: ci-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Node and npm are pinned to what the Dockerfile actually builds with
      # (node:26.5.0-slim + npm@12.0.1). A CI job on a different npm major is
      # testing a toolchain nobody ships: npm 10 and npm 12 disagree about how
      # esbuild's optional per-platform packages are recorded, so a lockfile
      # written by one is rejected by the other. Matching the image means a
      # green frontend job actually predicts a green `docker build`.
      #
      # The version is read from frontend/.nvmrc, which is also what pins
      # developers (with package.json "engines"). Pinning CI alone was worse
      # than not pinning it at all: Node 26 ships a `localStorage` global that
      # shadows jsdom's, so the draft-autosave suite passed on every dev
      # machine (Node 24) and failed all 14 cases here. CI must not be the
      # first place a version difference shows up.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: pin npm to the image's version
        run: npm install -g npm@12.0.1

      # `npm ci` here for the same reason the Dockerfile uses it: CI must
      # build the dependency set the lockfile pins, not whatever resolves today.
      - name: npm ci
        run: npm ci

      # Blocking gate on runtime dependencies only. dompurify, openpgp and
      # quill are what a hostile email actually reaches; a high-severity
      # advisory against any of them should stop a merge.
      #
      # --omit=dev is a deliberate scope, not a way to duck a finding. The
      # dev-only tree currently carries a high against vite (dev-server path
      # traversal, Windows-only, fixed by a semver-major bump), which never
      # runs anywhere but a developer's laptop and is not present in the image
      # — the runtime stage is debian-slim with no Node at all. Gating on it
      # would hold every unrelated merge hostage to a major build-tool upgrade.
      # --audit-level=low for runtime dependencies, not high.
      #
      # At `high` this gate passed on every push while quill 2.0.3 carried a
      # published XSS advisory (GHSA-v3m3-f69x-jf25) rated low, in the compose
      # editor — where reply/forward quoting puts sender-controlled HTML.
      # Severity ratings are assigned for a generic consumer; "low" for a text
      # editor is not low for one that eats hostile email.
      #
      # The runtime dependency list is seven packages long, so a low-severity
      # advisory on one of them is worth a human looking at it.
      - name: npm audit (runtime dependencies)
        run: npm audit --omit=dev --audit-level=low

      # Dev-dependency advisories still get surfaced, just not as a merge
      # blocker. Reported rather than silent, which is the difference between
      # a known risk and an unknown one.
      - name: npm audit (dev dependencies, advisory only)
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: typecheck
        run: npx tsc --noEmit

      - name: test
        run: npm test -- --run

      - name: build
        run: npm run build

  relay:
    name: ci-relay
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc

      # The relay Workers hold the FCM/APNs credentials and enforce token
      # ownership for every self-hosted server, and nothing in CI ran against
      # them at all — not even a typecheck. Both bugs the test below covers
      # (a rollback deleting ownership a concurrent send had earned, a takeover
      # decided from a KV read that cannot see a key minted seconds ago)
      # typechecked perfectly, so the typecheck is the floor, not the gate.
      - name: typecheck (fcm relay)
        working-directory: worker
        run: npm ci && npm run typecheck

      - name: typecheck (apns relay)
        working-directory: worker-apns
        run: npm ci && npm run typecheck

      # No test framework and no install: node's own runner and type stripping.
      - name: claim-ownership interleavings
        run: node --test push-relay-shared/relay-claims.test.ts

  docker:
    name: ci-docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Builds the image the same way a self-hoster does, which is what
      # catches a bad Ollama pin (the SHA-256 check fails the build) or a
      # lockfile that no longer satisfies `npm ci`.
      #
      # Cached through the GitHub Actions cache: uncached, every push
      # recompiled the Go binary, re-ran `npm ci`, and re-downloaded the
      # ~1.4 GB Ollama tarball from scratch.
      - name: docker build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: kypost-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A built image that cannot start is not a passing build. This catches
      # the class of failure the build step structurally cannot: a bad
      # supervisord config, an entrypoint whose chown fails, a missing runtime
      # dependency. It is also what makes the Dockerfile's HEALTHCHECK load
      # bearing rather than decorative.
      #
      # KYPOST_BIND is required, and this step is the caller that has to supply
      # it — docker-compose.yml enforces it with `${KYPOST_BIND:?}` and never
      # reaches the entrypoint empty, but a bare `docker run` does. Loopback,
      # because no port is published here and the healthcheck runs inside the
      # container. Do not answer a failure here by loosening the entrypoint.
      - name: container starts and reports healthy
        run: |
          docker run -d --name kypost-ci -e KYPOST_BIND=127.0.0.1 kypost-server:ci
          for i in $(seq 1 90); do
            status="$(docker inspect -f '{{.State.Health.Status}}' kypost-ci 2>/dev/null || echo starting)"
            if [ "$status" = "healthy" ]; then
              echo "container reported healthy after ${i}s"
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' kypost-ci)" != "true" ]; then
              echo "container exited before becoming healthy" >&2
              exit 1
            fi
            sleep 2
          done
          echo "container never became healthy" >&2
          exit 1

      # The other half of the step above: prove the gate still bites. Without
      # this, "make the smoke test pass" and "delete the security check" are
      # indistinguishable to CI, and the cheap way to fix a red build is to
      # loosen the entrypoint. Exits in milliseconds — nothing boots.
      - name: entrypoint refuses non-loopback cleartext
        run: |
          if docker run --rm -e KYPOST_BIND=0.0.0.0 kypost-server:ci 2>/tmp/guard.err; then
            echo "entrypoint accepted a non-loopback cleartext bind" >&2
            exit 1
          fi
          grep -q 'refusing non-loopback cleartext HTTP' /tmp/guard.err \
            || { echo "refused, but not by the bind guard:" >&2; cat /tmp/guard.err >&2; exit 1; }
          echo "guard refused 0.0.0.0 without TLS or ALLOW_INSECURE_HTTP"

      - name: container logs
        if: always()
        run: docker logs kypost-ci 2>&1 | tail -80 || true
