name: ci

# AGENTS.md's governance section requires "CI must pass" for new logic. Until
# this file existed that rule was unsatisfiable — 28 Go packages with real
# tests and nothing running them on push.
# Push is restricted to main rather than "**": with a pull_request trigger as
# well, every push to a PR branch otherwise runs the whole suite twice for the
# same commit.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Supersede an in-flight run when the same ref is pushed again. Without this,
# three quick pushes to a PR branch keep three full matrices alive — including
# three `docker build`s, the most expensive job here — reporting on two commits
# nobody is waiting for. main is excluded from cancellation: a green tick
# against a specific main commit is the record of whether that commit built,
# and cancelling it destroys that record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Every action below is pinned to a commit SHA rather than a tag. A tag is a
# mutable pointer: whoever controls it controls a job running in this
# repository, and ollama-bump.yml's job holds `contents: write` and
# `pull-requests: write`. The Dockerfile already refuses to trust an unpinned
# Ollama tarball for exactly this reason; the CI that builds it gets the same
# standard. Dependabot keeps these current — see .github/dependabot.yml.

jobs:
  backend-api:
    name: ci-backend-api
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      # internal/api package tests run serially due to global hashCostN state
      # managed by TestMain. This job runs only the api package tests, which
      # take 7-8 minutes dominated by scrypt derivations at production cost.
      - name: go test -race (api package only)
        run: go test -race -count=1 -timeout=20m ./internal/api/...

  backend-other:
    name: ci-backend-other
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      # Run all non-api backend tests in parallel. This includes processor,
      # users, pgpmail, contacts, state, rules, mailmsg, adapters, and
      # utility packages. These can safely run together and complete in ~4-5 minutes.
      - name: go test -race (all packages except api)
        run: go list ./... | grep -v "^kypost-server/backend/internal/api$" | xargs go test -race -count=1 -timeout=20m

  frontend:
    name: ci-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Node and npm are pinned to what the Dockerfile actually builds with
      # (node:26.5.0-slim + npm@12.0.1). A CI job on a different npm major is
      # testing a toolchain nobody ships: npm 10 and npm 12 disagree about how
      # esbuild's optional per-platform packages are recorded, so a lockfile
      # written by one is rejected by the other. Matching the image means a
      # green frontend job actually predicts a green `docker build`.
      #
      # The version is read from frontend/.nvmrc, which is also what pins
      # developers (with package.json "engines"). Pinning CI alone was worse
      # than not pinning it at all: Node 26 ships a `localStorage` global that
      # shadows jsdom's, so the draft-autosave suite passed on every dev
      # machine (Node 24) and failed all 14 cases here. CI must not be the
      # first place a version difference shows up.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: pin npm to the image's version
        run: npm install -g npm@12.0.1

      # `npm ci` here for the same reason the Dockerfile uses it: CI must
      # build the dependency set the lockfile pins, not whatever resolves today.
      - name: npm ci
        run: npm ci

      # Blocking gate on runtime dependencies only. dompurify, openpgp and
      # quill are what a hostile email actually reaches; a high-severity
      # advisory against any of them should stop a merge.
      #
      # --omit=dev is a deliberate scope, not a way to duck a finding. The
      # dev-only tree currently carries a high against vite (dev-server path
      # traversal, Windows-only, fixed by a semver-major bump), which never
      # runs anywhere but a developer's laptop and is not present in the image
      # — the runtime stage is debian-slim with no Node at all. Gating on it
      # would hold every unrelated merge hostage to a major build-tool upgrade.
      # --audit-level=low for runtime dependencies, not high.
      #
      # At `high` this gate passed on every push while quill 2.0.3 carried a
      # published XSS advisory (GHSA-v3m3-f69x-jf25) rated low, in the compose
      # editor — where reply/forward quoting puts sender-controlled HTML.
      # Severity ratings are assigned for a generic consumer; "low" for a text
      # editor is not low for one that eats hostile email.
      #
      # The runtime dependency list is seven packages long, so a low-severity
      # advisory on one of them is worth a human looking at it.
      - name: npm audit (runtime dependencies)
        run: npm audit --omit=dev --audit-level=low

      # Dev-dependency advisories still get surfaced, just not as a merge
      # blocker. Reported rather than silent, which is the difference between
      # a known risk and an unknown one.
      - name: npm audit (dev dependencies, advisory only)
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: typecheck
        run: npx tsc --noEmit

      - name: test
        run: npm test -- --run

      - name: build
        run: npm run build

  relay:
    name: ci-relay
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc

      # The relay Workers hold the FCM/APNs credentials and enforce token
      # ownership for every self-hosted server, and nothing in CI ran against
      # them at all — not even a typecheck. Both bugs the test below covers
      # (a rollback deleting ownership a concurrent send had earned, a takeover
      # decided from a KV read that cannot see a key minted seconds ago)
      # typechecked perfectly, so the typecheck is the floor, not the gate.
      - name: typecheck (fcm relay)
        working-directory: worker
        run: npm ci && npm run typecheck

      - name: typecheck (apns relay)
        working-directory: worker-apns
        run: npm ci && npm run typecheck

      # No test framework and no install: node's own runner and type stripping.
      # Files are listed explicitly rather than by directory: `node --test <dir>`
      # walks it, and these directories have node_modules in them.
      - name: relay behaviour
        run: |
          node --test \
            push-relay-shared/relay-claims.test.mts \
            push-relay-shared/relay-budget.test.mts \
            worker-apns/src/apns-config.test.mts \
            worker-apns/src/apns-stale.test.mts \
            worker-apns/src/send-budget-order.test.mts \
            worker/src/fcm-oauth-redaction.test.mts \
            worker/src/fcm-stale.test.mts

  scripts:
    name: ci-scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # scripts/ is the supported install and update path — the thing a
      # self-hoster runs against a live deployment — and nothing in CI touched
      # it. update-host.test.sh already existed and covered the two outcomes
      # that matter (a no-op update, and a failed update that rolls back), so
      # the gap was not "no test", it was "the test was never run".
      #
      # These scripts have no runtime dependency to install: the updater test
      # fakes docker and gh with shell stubs on PATH.
      #
      # Syntax only, not shellcheck. A lint gate whose current result is unknown
      # is a gate that goes red on the commit that adds it, and the job's value
      # here is the updater test rather than style enforcement. Adding
      # shellcheck is a separate change that starts by fixing what it reports.
      - name: shell syntax
        run: |
          shopt -s nullglob
          for f in scripts/*.sh; do
            bash -n "$f"
          done

      - name: update-host self-check
        run: scripts/update-host.test.sh

      # release-image.yml is the one workflow nothing exercises until a release
      # is published, and its failure mode is silence: a refactor once deleted
      # its build, attest, verify and promote steps, leaving a job that logged
      # into the registry and went green without publishing anything. Assert
      # the stages exist, and that the privileged workflows are pinned to
      # commits rather than to tags anyone can move under them.
      - name: release workflow shape
        run: |
          set -euo pipefail
          for step in \
            "Build and publish the immutable version tag" \
            "Publish GitHub image attestation" \
            "Verify the attestation before promoting" \
            "Decide whether this release may move stable" \
            "Promote the verified digest to stable"; do
            grep -qF -e "- name: $step" .github/workflows/release-image.yml \
              || { echo "::error::release-image.yml is missing step: $step" >&2; exit 1; }
          done

          # publish-main.yml has the same silent failure mode, and one stage
          # that matters more than the rest: it must not move :main until this
          # workflow has passed for the exact commit. It used to publish
          # straight off the push, racing the tests it was supposed to wait
          # for. Assert both the gate and the trigger that feeds it.
          for step in \
            "Require CI to have passed for this commit" \
            "Build and publish main tag" \
            "Publish GitHub image attestation" \
            "Verify the attestation"; do
            grep -qF -e "- name: $step" .github/workflows/publish-main.yml \
              || { echo "::error::publish-main.yml is missing step: $step" >&2; exit 1; }
          done
          grep -qF "workflow_run:" .github/workflows/publish-main.yml \
            || { echo "::error::publish-main.yml must trigger on workflow_run, not on push" >&2; exit 1; }

          # Anchored to the start of the line so this step does not read its
          # own grep patterns as workflow references.
          unpinned="$(grep -rhE '^[[:space:]]*(- )?uses:' .github/workflows/ \
            | sed 's/.*uses:[[:space:]]*//; s/[[:space:]]*#.*//' \
            | grep -vE '^(\./|[^ ]+@[0-9a-f]{40}$)' || true)"
          if [ -n "$unpinned" ]; then
            echo "::error::pin these to a full commit SHA:" >&2
            printf '%s\n' "$unpinned" >&2
            exit 1
          fi

      # The model installer's failure paths, with ollama and sleep stubbed out.
      # Its previous version gave up and exited, which supervisord could not
      # distinguish from success — so the behaviour worth testing is that it
      # keeps retrying rather than that it eventually pulls something.
      - name: pull-ollama-model self-check
        run: scripts/pull-ollama-model.test.sh

      # Compose is what the updater drives, so a compose file that no longer
      # parses breaks the update path regardless of whether the image builds.
      # The required variables are supplied here only to let interpolation
      # resolve — `${KYPOST_BIND:?}` aborts config parsing when unset.
      - name: compose config
        env:
          KYPOST_BIND: 127.0.0.1
        run: docker compose config --quiet

  docker:
    name: ci-docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Builds the image the same way a self-hoster does, which is what
      # catches a bad Ollama pin (the SHA-256 check fails the build) or a
      # lockfile that no longer satisfies `npm ci`.
      #
      # Cached through the GitHub Actions cache: uncached, every push
      # recompiled the Go binary, re-ran `npm ci`, and re-downloaded the
      # ~1.4 GB Ollama tarball from scratch.
      - name: docker build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: kypost-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A built image that cannot start is not a passing build. This catches
      # the class of failure the build step structurally cannot: a bad
      # supervisord config, an entrypoint whose chown fails, a missing runtime
      # dependency. It is also what makes the Dockerfile's HEALTHCHECK load
      # bearing rather than decorative.
      #
      # KYPOST_BIND is required, and this step is the caller that has to supply
      # it — docker-compose.yml enforces it with `${KYPOST_BIND:?}` and never
      # reaches the entrypoint empty, but a bare `docker run` does. Loopback,
      # because no port is published here and the healthcheck runs inside the
      # container. Do not answer a failure here by loosening the entrypoint.
      - name: container starts and reports healthy
        run: |
          docker run -d --name kypost-ci -e KYPOST_BIND=127.0.0.1 kypost-server:ci
          for i in $(seq 1 90); do
            status="$(docker inspect -f '{{.State.Health.Status}}' kypost-ci 2>/dev/null || echo starting)"
            if [ "$status" = "healthy" ]; then
              echo "container reported healthy after ${i}s"
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' kypost-ci)" != "true" ]; then
              echo "container exited before becoming healthy" >&2
              exit 1
            fi
            sleep 2
          done
          echo "container never became healthy" >&2
          exit 1

      # "Healthy" is now a stronger claim than it was, and this step is what
      # keeps it honest.
      #
      # /api/health used to answer for the API process alone, so a container
      # whose daemon was dead still reported healthy — the smoke test above
      # passed on an image that could not poll mail. The daemon now publishes a
      # heartbeat that the endpoint requires (health/daemon.go), which this
      # asserts directly rather than trusting the aggregate flag.
      #
      # Deliberately NOT asserting that the model is installed. Pulling it takes
      # a multi-gigabyte download from an external registry at container start,
      # which would make every CI run depend on that registry being up and fast.
      # The model's absence is not silent any more, which was the actual defect:
      # the installer retries indefinitely instead of giving up, and a missing
      # model surfaces as classifierFailing on this endpoint.
      - name: daemon is reporting its own health
        run: |
          set -eu
          body="$(docker exec kypost-ci sh -c 'curl -fsS "http://127.0.0.1:${WEB_PORT}/api/health"')"
          echo "$body"
          if ! printf '%s' "$body" | grep -q '"daemonHeartbeatUtc"'; then
            echo "no daemon heartbeat: the poller is not reporting" >&2
            exit 1
          fi
          if printf '%s' "$body" | grep -q '"daemonStale":true'; then
            echo "daemon heartbeat is stale in a container that just started" >&2
            exit 1
          fi
          echo "daemon heartbeat present and fresh"

      # The other half of the step above: prove the gate still bites. Without
      # this, "make the smoke test pass" and "delete the security check" are
      # indistinguishable to CI, and the cheap way to fix a red build is to
      # loosen the entrypoint. Exits in milliseconds — nothing boots.
      - name: entrypoint refuses non-loopback cleartext
        run: |
          if docker run --rm -e KYPOST_BIND=0.0.0.0 kypost-server:ci 2>/tmp/guard.err; then
            echo "entrypoint accepted a non-loopback cleartext bind" >&2
            exit 1
          fi
          grep -q 'refusing non-loopback cleartext HTTP' /tmp/guard.err \
            || { echo "refused, but not by the bind guard:" >&2; cat /tmp/guard.err >&2; exit 1; }
          echo "guard refused 0.0.0.0 without TLS or ALLOW_INSECURE_HTTP"

      - name: container logs
        if: always()
        run: docker logs kypost-ci 2>&1 | tail -80 || true
