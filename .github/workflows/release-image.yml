name: publish release image

on:
  release:
    types: [published]

# One release publish at a time. Two runs racing both end in "move :stable",
# and the winner is whichever finished last rather than whichever is newer.
# cancel-in-progress is deliberately false: a run that has already pushed an
# immutable version tag must be allowed to finish attesting it.
concurrency:
  group: release-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  attestations: write
  artifact-metadata: write
  id-token: write
  # Read the check runs recorded against the tagged commit. Without this the
  # CI gate below cannot see whether ci.yml ever passed for it.
  checks: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Literal, and lowercase: a registry path must be lowercase, and
      # ${{ github.repository_owner }} is not. Every other reference to this
      # image — docker-compose.yml, .env.example, scripts/update-host.sh,
      # publish-main.yml — spells it out the same way.
      IMAGE_NAME: ghcr.io/busness-app/kypost-server
    steps:
      # First step, before the checkout: this reads nothing but the tag name,
      # and a bad tag should cost nothing to reject.
      #
      # The server compares dotted numeric versions, so refuse an image tag
      # that cannot be reported correctly to installed operators. This used to
      # be a job-level `if: startsWith(tag_name, 'v')`, which does not refuse
      # anything — it skips the job, and a skipped job is green. A release
      # tagged `1.0.0` or `release-1.0.0` therefore existed with no image and
      # no failure anyone would notice. Every release in this repository is a
      # server release, so there is no tag namespace this job should sit out;
      # the only correct answers are "published" and "red".
      - name: Validate release version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if [ "$version" = "$TAG" ] || ! printf '%s' "$version" \
            | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::release tag must be v<major>.<minor>.<patch>, got: $TAG" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Refuse to publish a tag the code does not agree with.
      #
      # serverVersion is compiled in, and it is the LEFT-HAND SIDE of the
      # hourly update check every install runs. Tagging v1.0.0 while that
      # constant still says 0.1.0 ships a 1.0 server that compares itself
      # against 1.0, decides it is behind, and emails the admin of every
      # install about an upgrade they are already running — forever, because
      # the comparison never stops being true. Nothing detected that, because
      # the constant is only ever read at runtime against live GitHub data.
      #
      # frontend/package.json is checked with it so "what version is this?" has
      # exactly one answer across the whole artifact.
      - name: Require the tag, serverVersion and frontend version to agree
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          server="$(sed -n 's/^const serverVersion = "\(.*\)"$/\1/p' \
            backend/internal/api/server_version.go)"
          frontend="$(node -p 'require("./frontend/package.json").version')"

          echo "tag=${VERSION} serverVersion=${server:-<unparsed>} frontend=${frontend:-<unparsed>}"

          if [ -z "$server" ]; then
            echo "::error::could not read serverVersion from backend/internal/api/server_version.go" >&2
            echo "If the constant was reformatted, update this check with it." >&2
            exit 1
          fi
          fail=""
          [ "$server" = "$VERSION" ] || fail="${fail} serverVersion(${server})"
          [ "$frontend" = "$VERSION" ] || fail="${fail} frontend/package.json(${frontend})"
          if [ -n "$fail" ]; then
            echo "::error::release ${VERSION} disagrees with:${fail}" >&2
            echo "Bump every version source in the commit you tag. See backend/AGENTS.md." >&2
            exit 1
          fi

      # Refuse to publish a commit that CI never passed.
      #
      # A release is a human action on an arbitrary ref. Nothing in this
      # workflow previously connected the thing being built to the thing that
      # was tested: tagging a red commit, or a commit CI had never seen at all,
      # produced a fully attested image and moved :stable onto it, and the
      # auto-updater in scripts/update-host.sh accepted it — because the
      # attestation is honest. Provenance says where an image came from, not
      # that it works, and the two are easy to confuse precisely because the
      # signature verifies either way.
      #
      # The check is against the resolved commit, not the tag: a tag is a
      # mutable pointer, and "this tag passed CI" is not a statement about any
      # particular code. `git rev-parse HEAD` is used rather than $GITHUB_SHA
      # because for an annotated tag the latter can name the tag object; this
      # reads the commit actions/checkout actually materialised, which is
      # exactly what `context: .` hands to the build below.
      - name: Require CI to have passed for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "tagged commit: $sha"

          # Every job ci.yml defines. Named explicitly rather than "did anything
          # succeed": a run that was cancelled, or one where the expensive
          # ci-docker job was skipped, must not read as a pass. A job added to
          # ci.yml and not added here is simply not part of the release gate,
          # which is a visible omission rather than a silent one.
          required="ci-backend-api ci-backend-other ci-frontend ci-relay ci-scripts ci-docker"

          # filter=latest asks the API for the most recent run per check name,
          # so a re-run supersedes what it replaced. It is currently also the
          # default, and is named anyway: the previous form read whichever
          # matching row happened to come last in the response and called it the
          # newest, which is not something the API promises — under pagination,
          # or a change of default, that silently becomes "an older success
          # outranks the failed re-run that replaced it", in the one direction
          # this gate must never fail.
          runs="$(gh api --paginate \
            "repos/${REPO}/commits/${sha}/check-runs?filter=latest&per_page=100" \
            --jq '.check_runs[] | "\(.name)\t\(.status)\t\(.conclusion // "none")"')"
          echo "check runs for this commit:"
          printf '%s\n' "${runs:-<none>}"

          missing=""
          for job in $required; do
            # Strict rather than "pick one and judge it": every row carrying this
            # job's name must be a completed success. With filter=latest there is
            # exactly one, so this is the same question asked in the shape that
            # cannot be answered wrongly if that ever stops being true.
            rows="$(printf '%s\n' "$runs" | awk -F'\t' -v j="$job" '$1 == j { print $2 "/" $3 }')"
            if [ -z "$rows" ]; then
              missing="${missing} ${job}(absent)"
              continue
            fi
            bad="$(printf '%s\n' "$rows" | grep -v '^completed/success$' || true)"
            if [ -n "$bad" ]; then
              missing="${missing} ${job}($(printf '%s' "$bad" | tr '\n' ','))"
            fi
          done

          if [ -n "$missing" ]; then
            echo "::error::refusing to publish ${sha}: CI did not pass for it —${missing}" >&2
            echo "Push the commit to main (or open a PR for it) and let ci.yml finish before releasing." >&2
            exit 1
          fi
          echo "all required CI jobs passed for ${sha}"

      - name: Log in to GitHub Container Registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      # Only the immutable version tag is published here. :stable is promoted
      # further down, AFTER the attestation exists and verifies.
      #
      # Publishing both at once made :stable move before anything had attested
      # it. If the attestation step then failed, the workflow went red with
      # :stable already pointing at an unattested image — scripts/update-host.sh
      # refuses that (it verifies before deploying), but a plain
      # `docker compose pull` does not, so the guarded path failed closed while
      # the unguarded path shipped it. A red workflow that already changed what
      # everyone downloads is not a failure anyone can act on.
      - name: Build and publish the immutable version tag
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.value }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pin to the published v2.3.0 commit. GitHub's newer generic attest
      # action is equivalent, but this dedicated action is the smallest pinned
      # image-provenance surface and its output is what update-host.sh verifies.
      - name: Publish GitHub image attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # Verify the attestation the same way the host updater will, before
      # promoting anything. Publishing an attestation and being able to verify
      # one are different claims, and operators only ever experience the second.
      - name: Verify the attestation before promoting
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.build.outputs.digest }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh attestation verify "oci://${IMAGE_NAME}@${DIGEST}" --repo "$REPO"

      # :stable must only ever move FORWARD, and only to a release operators
      # opted into.
      #
      # Concurrency serializes runs but does not order them by version. Patching
      # an old branch (v0.9.1 published after v1.0.0 already shipped) is a normal
      # thing to do, and its immutable tag should absolutely be published — but
      # promoting it to :stable silently downgrades every install that follows
      # that tag. The version tag above is unconditional; only this step is
      # gated.
      - name: Decide whether this release may move stable
        id: promote
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
          REPO: ${{ github.repository }}
          # GitHub's `published` activity type fires for prereleases too, so
          # this job runs for them and must decide what that means.
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail

          # THIS release's own prerelease flag, checked before anything else.
          #
          # The version comparison below excludes prereleases from the list it
          # compares against and then adds $VERSION back unconditionally — so
          # the one release whose prerelease flag was never consulted was this
          # one. A prerelease tagged with a plain numeric version (the flag is
          # a checkbox, independent of the tag, and `v0.3.0-rc` is rejected by
          # the validation step above — so a prerelease that reaches this point
          # is tagged exactly like a stable one) compared as the newest thing
          # in the repository and moved :stable onto itself. That is the
          # failure this whole step exists to prevent, arriving through the
          # door it left open.
          #
          # The immutable version tag is already published at this point, which
          # is correct: testers pull v0.3.0 by name. Only :stable is withheld.
          if [ "$PRERELEASE" = "true" ]; then
            echo "::notice::${VERSION} is a prerelease; publishing the version tag but leaving :stable where it is"
            echo "move=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Every published, non-draft, non-prerelease dotted-numeric release.
          # Drafts and prereleases are excluded because operators following
          # :stable did not opt into them.
          published="$(gh api --paginate "repos/${REPO}/releases" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' \
            | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true)"

          highest="$(printf '%s\n%s\n' "$published" "$VERSION" | sort -V | tail -n1)"
          echo "highest published release: ${highest}; this release: ${VERSION}"

          if [ "$highest" != "$VERSION" ]; then
            echo "::notice::${VERSION} is older than ${highest}; publishing the version tag but leaving :stable where it is"
            echo "move=false" >> "$GITHUB_OUTPUT"
          else
            echo "move=true" >> "$GITHUB_OUTPUT"
          fi

      # Promote by DIGEST, not by rebuilding or re-tagging from a name: this
      # points :stable at the exact bytes that were just attested and verified,
      # with no second build that could differ.
      - name: Promote the verified digest to stable
        if: steps.promote.outputs.move == 'true'
        env:
          VERSION: ${{ steps.version.outputs.value }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:stable" \
            "${IMAGE_NAME}@${DIGEST}"
          echo "stable now points at ${IMAGE_NAME}@${DIGEST} (${VERSION})"
