name: publish release image

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write
  attestations: write
  artifact-metadata: write
  id-token: write
  # Read the check runs recorded against the tagged commit. Without this the
  # CI gate below cannot see whether ci.yml ever passed for it.
  checks: read

jobs:
  publish:
    # The server compares dotted numeric versions, so refuse an image tag that
    # cannot be reported correctly to installed operators.
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/kypost-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Validate release version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "release tag must be v<major>.<minor>.<patch>, got: $TAG" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      # Refuse to publish a commit that CI never passed.
      #
      # A release is a human action on an arbitrary ref. Nothing in this
      # workflow previously connected the thing being built to the thing that
      # was tested: tagging a red commit, or a commit CI had never seen at all,
      # produced a fully attested image and moved :stable onto it, and the
      # auto-updater in scripts/update-host.sh accepted it — because the
      # attestation is honest. Provenance says where an image came from, not
      # that it works, and the two are easy to confuse precisely because the
      # signature verifies either way.
      #
      # The check is against the resolved commit, not the tag: a tag is a
      # mutable pointer, and "this tag passed CI" is not a statement about any
      # particular code. `git rev-parse HEAD` is used rather than $GITHUB_SHA
      # because for an annotated tag the latter can name the tag object; this
      # reads the commit actions/checkout actually materialised, which is
      # exactly what `context: .` hands to the build below.
      - name: Require CI to have passed for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "tagged commit: $sha"

          # Every job ci.yml defines. Named explicitly rather than "did anything
          # succeed": a run that was cancelled, or one where the expensive
          # ci-docker job was skipped, must not read as a pass. A job added to
          # ci.yml and not added here is simply not part of the release gate,
          # which is a visible omission rather than a silent one.
          required="ci-backend-api ci-backend-other ci-frontend ci-relay ci-docker"

          runs="$(gh api --paginate \
            "repos/${REPO}/commits/${sha}/check-runs?per_page=100" \
            --jq '.check_runs[] | "\(.name)\t\(.status)\t\(.conclusion // "none")"')"
          echo "check runs for this commit:"
          printf '%s\n' "${runs:-<none>}"

          missing=""
          for job in $required; do
            # A job may legitimately have several runs (a re-run). Require the
            # most recent one to be a completed success.
            conclusion="$(printf '%s\n' "$runs" | awk -F'\t' -v j="$job" '$1 == j && $2 == "completed" { c = $3 } END { print c }')"
            if [ "$conclusion" != "success" ]; then
              missing="${missing} ${job}(${conclusion:-absent})"
            fi
          done

          if [ -n "$missing" ]; then
            echo "::error::refusing to publish ${sha}: CI did not pass for it —${missing}" >&2
            echo "Push the commit to main (or open a PR for it) and let ci.yml finish before releasing." >&2
            exit 1
          fi
          echo "all required CI jobs passed for ${sha}"

      - name: Log in to GitHub Container Registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build, publish, and attest image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.value }}
            ${{ env.IMAGE_NAME }}:stable
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pin to the published v2.3.0 commit. GitHub's newer generic attest
      # action is equivalent, but this dedicated action is the smallest pinned
      # image-provenance surface and its output is what update-host.sh verifies.
      - name: Publish GitHub image attestation
        uses: actions/attest-build-provenance@db473fddc028af60658334401dc6fa3ffd8669fd # v2.3.0
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
