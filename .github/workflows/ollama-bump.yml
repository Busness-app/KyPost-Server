name: bump pinned ollama

# The Dockerfile pins Ollama to a specific release tarball plus its SHA-256,
# rather than piping ollama.com/install.sh into a shell. Pinning is only
# maintainable if something keeps the pin current, so this runs daily and
# opens a PR when a newer release is available.
#
# The 3-day soak is the point: it only ever advances to a release that has
# been public for at least that long, so a release that gets yanked, or that
# ships an immediately-obvious regression, is never picked up automatically.
# The PR still needs a human to merge, and CI builds the image (verifying the
# checksum) before it can be.

on:
  schedule:
    # 05:20 UTC daily. Off the hour to avoid the thundering herd of
    # everyone's midnight cron.
    - cron: "20 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  MIN_RELEASE_AGE_DAYS: "3"
  OLLAMA_ASSET: ollama-linux-amd64.tar.zst

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve newest sufficiently-soaked release
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Newest non-draft, non-prerelease release published at least
          # MIN_RELEASE_AGE_DAYS ago. Releases come back newest-first.
          # Scratch files go to the runner temp dir, never the working tree:
          # create-pull-request commits everything it finds changed, so writing
          # them here put 232 lines of release metadata and a checksum listing
          # into the repo on every bump (see f7f1cdb).
          gh api repos/ollama/ollama/releases --paginate \
            --jq '.[] | select(.draft == false and .prerelease == false)
                      | {tag: .tag_name, published: .published_at}' \
            > "$RUNNER_TEMP/releases.jsonl"

          version="$(python3 - <<'PY'
          import json, os, sys
          from datetime import datetime, timedelta, timezone

          min_age = timedelta(days=int(os.environ["MIN_RELEASE_AGE_DAYS"]))
          now = datetime.now(timezone.utc)
          for line in open(os.path.join(os.environ["RUNNER_TEMP"], "releases.jsonl")):
              rel = json.loads(line)
              published = datetime.fromisoformat(rel["published"].replace("Z", "+00:00"))
              if now - published >= min_age:
                  print(rel["tag"].lstrip("v"))
                  sys.exit(0)
          sys.exit("no release older than the soak window")
          PY
          )"

          # The tag comes from an upstream repo, so constrain its shape
          # before it reaches a URL or a commit message.
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "refusing unexpected version string: $version" >&2
            exit 1
          fi

          current="$(sed -n 's/^ARG OLLAMA_VERSION=//p' Dockerfile)"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$version" = "$current" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already pinned to $current; nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Pinned $current -> $version"
          fi

      - name: Fetch and verify published checksum
        id: checksum
        if: steps.resolve.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          # Take the SHA from the release's own sha256sum.txt rather than
          # downloading 1.4 GB just to hash it. The Docker build re-checks it
          # against the real tarball, so a wrong value fails CI, not users.
          curl -fsSL -o "$RUNNER_TEMP/sha256sum.txt" \
            "https://github.com/ollama/ollama/releases/download/v${VERSION}/sha256sum.txt"

          sha="$(awk -v asset="./${OLLAMA_ASSET}" '$2 == asset { print $1 }' "$RUNNER_TEMP/sha256sum.txt")"
          if [ -z "$sha" ]; then
            echo "no checksum for ${OLLAMA_ASSET} in v${VERSION}/sha256sum.txt" >&2
            exit 1
          fi
          case "$sha" in
            [0-9a-f]*) [ "${#sha}" -eq 64 ] || { echo "malformed sha: $sha" >&2; exit 1; } ;;
            *) echo "malformed sha: $sha" >&2; exit 1 ;;
          esac
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Rewrite the pin
        if: steps.resolve.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          SHA: ${{ steps.checksum.outputs.sha }}
        run: |
          set -euo pipefail
          # Values go through env, never interpolated into the script body.
          python3 - <<'PY'
          import os, re, pathlib
          version, sha = os.environ["VERSION"], os.environ["SHA"]
          p = pathlib.Path("Dockerfile")
          src = p.read_text()
          src, n1 = re.subn(r"^ARG OLLAMA_VERSION=.*$", f"ARG OLLAMA_VERSION={version}", src, flags=re.M)
          src, n2 = re.subn(r"^ARG OLLAMA_SHA256=.*$", f"ARG OLLAMA_SHA256={sha}", src, flags=re.M)
          assert n1 == 1 and n2 == 1, f"expected one match each, got {n1} and {n2}"
          p.write_text(src)
          PY
          git diff --stat

      - name: Open PR
        if: steps.resolve.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/bump-ollama
          base: main
          commit-message: "chore(deps): bump pinned Ollama to ${{ steps.resolve.outputs.version }}"
          title: "chore(deps): bump pinned Ollama to ${{ steps.resolve.outputs.version }}"
          body: |
            Automated bump of the pinned Ollama release in `Dockerfile`.

            - `${{ steps.resolve.outputs.current }}` -> `${{ steps.resolve.outputs.version }}`
            - Released at least ${{ env.MIN_RELEASE_AGE_DAYS }} days ago (soak window).
            - SHA-256 taken from the release's published `sha256sum.txt`; the
              `docker build` job re-verifies it against the real tarball.

            Check the upstream release notes before merging.
          delete-branch: true
