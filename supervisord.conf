[unix_http_server]
file=/kypost/state/supervisor.sock
chmod=0700
chown=kypost:kypost

[supervisord]
nodaemon=true
# No `user=` here: scripts/entrypoint.sh has already dropped to kypost via
# setpriv before exec'ing supervisord, so this process and every program it
# starts are unprivileged. Setting user= as well would make supervisord try
# to setuid as a non-root user and warn.
logfile=/kypost/logs/supervisord.log
pidfile=/kypost/state/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///kypost/state/supervisor.sock

# startretries is BOUNDED, and FATAL takes the container down with it.
#
# Two failure modes, and the fix has to cover both.
#
# supervisord's default of 3 gives up, marks the program FATAL, and keeps running
# happily itself — PID 1 healthy, the container "running", nothing being served.
# Docker's restart policies react to a container EXITING, never to a healthcheck
# failing, so nothing recovers it.
#
# The previous fix for that was startretries=20. supervisord does not back
# off between restart attempts, so that turns a program which exits immediately
# — bad config, a corrupt state file, a panic on boot — into a restart loop
# running as fast as the machine allows, forever, burning a core inside a
# container that is also running an LLM. Invisible death traded for invisible
# hot loop; still nothing exits, still nothing recovers.
#
# So: 20 retries, which covers the transient case the big number was reaching for
# (a dependency that is not ready yet — the volume, Ollama, DNS), and then the
# crashexit listener below takes PID 1 down so `restart: unless-stopped`
# restarts the whole container. THAT path has backoff, and a container restart
# loop is visible in `docker ps` and to any orchestrator.
#
# Log rotation is set explicitly rather than left to supervisord's defaults
# (50 MB x 10 backups per stream). Four programs with two streams each is up to
# 4 GB on the state volume, which on a self-hosted box is the disk filling for
# reasons nobody connected to logging.
# stopwaitsecs on api and daemon, for the same reason docker-compose.yml sets
# stop_grace_period: supervisord's default is 10 seconds from SIGTERM to
# SIGKILL, and both programs have real shutdown work behind that signal. The API
# drains in-flight HTTP requests (app.go's shutdownTimeout, 20s) and the daemon
# cancels its poll tick and waits for the IMAP, SMTP and state writes underneath
# to return. A SIGKILL through either is a half-finished external action —
# mail sent with no record of it, or bookkeeping written half way.
#
# Ollama is left at the default: it holds no durable state worth draining, and a
# model unload that gets killed costs nothing but a reload.
[program:api]
command=/usr/local/bin/kypost-server --mode server
autostart=true
autorestart=true
startretries=20
startsecs=3
stopwaitsecs=30
priority=10
stdout_logfile=/kypost/logs/api.log
stderr_logfile=/kypost/logs/api.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

[program:daemon]
command=/usr/local/bin/kypost-server --mode daemon
autostart=true
autorestart=true
startretries=20
startsecs=3
stopwaitsecs=30
priority=10
stdout_logfile=/kypost/logs/daemon.log
stderr_logfile=/kypost/logs/daemon.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

[program:ollama]
# startretries: see the note on [program:api]. Ollama's first start races the
# model volume being mounted and chowned, which is exactly the transient failure
# supervisord's default of 3 gives up on — and exactly the case 20 covers.
command=/bin/bash -c "set -o pipefail; /bin/sh /opt/kypost/scripts/start-ollama.sh 2>&1 | while IFS= read -r line; do echo \"[$(date '+%%Y-%%m-%%d %%H:%%M:%%S')] $line\"; done"
environment=HOME="/home/kypost",OLLAMA_MODELS="/kypost/ollama-models"
autostart=true
autorestart=true
startretries=20
startsecs=3
priority=10
stdout_logfile=/kypost/logs/ollama.log
stderr_logfile=/kypost/logs/ollama.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

# autorestart=unexpected, not false.
#
# The script now retries the pull itself, indefinitely and on a capped interval,
# and exits 0 only once the model is installed — so the common failure it used
# to die on is handled inside it and needs no restart. What autorestart=false
# could not handle is the script itself dying: an exit 1 from the "Ollama never
# answered" guard, or the process being killed. Both went EXITED rather than
# FATAL, so the crashexit listener never saw them and nothing retried, leaving a
# container permanently without the model it classifies with.
#
# exitcodes=0 makes success the only expected exit, so anything else brings it
# back.
#
# startsecs stays 0, and that is load bearing in both directions. The script
# exits 0 in milliseconds when the model is already installed — the common case
# on every restart after the first — and any startsecs above zero would count
# that success as a failed start, retry it, and eventually go FATAL on a
# container that is perfectly fine. The hot loop that startsecs would otherwise
# guard against is handled where it belongs instead: every retryable failure is
# a sleep inside the script, so a restart cycle here can only be caused by
# something genuinely unexpected.
[program:ollama-model]
command=/bin/sh /opt/kypost/scripts/pull-ollama-model.sh
environment=HOME="/home/kypost",OLLAMA_MODELS="/kypost/ollama-models"
autostart=true
autorestart=unexpected
exitcodes=0
startretries=20
startsecs=0
priority=11
stdout_logfile=/kypost/logs/ollama-model.log
stderr_logfile=/kypost/logs/ollama-model.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

# See the startretries note above: this is the half that makes a bounded retry
# count safe. Without it, FATAL means "supervisord keeps running in front of a
# dead service" and the container never exits, so nothing restarts it.
[eventlistener:crashexit]
command=/bin/sh /opt/kypost/scripts/crash-exit.sh
events=PROCESS_STATE_FATAL
autostart=true
autorestart=true
stdout_logfile=/kypost/logs/crashexit.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=2
stderr_logfile=/kypost/logs/crashexit.err.log
stderr_logfile_maxbytes=1MB
stderr_logfile_backups=2
